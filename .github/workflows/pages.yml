name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        
      - name: Setup Pages
        uses: actions/configure-pages@v6
        
      - name: Prepare site directory
        run: |
          mkdir -p _site
          # Copy the web frontend files to the root of the site
          cp -r web/* _site/
          # Remove symlink copied from web/data so real files can be stored
          rm -rf _site/data
          # Ensure the data directory structure exists
          mkdir -p _site/data/output
          # Copy the compiled semantic maps
          cp data/output/wordmap_2d.json _site/data/output/
          cp data/output/verse_index.json _site/data/output/
          cp data/output/bookmap_2d.json _site/data/output/
          cp data/output/versemap_2d.json _site/data/output/
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
