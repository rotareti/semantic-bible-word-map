name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Prepare site directory
        run: |
          mkdir -p _site
          # Copy the web frontend files to the root of the site
          cp -r web/* _site/
          # Ensure the data directory structure exists
          mkdir -p _site/data/output
          # Copy the compiled semantic maps
          cp data/output/wordmap_2d.json _site/data/output/
          cp data/output/wordmap_3d.json _site/data/output/
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
