  <!-- Semantic Nodes -->
  <g id="nodes" stroke="#1e2c3a" stroke-width="6">
    <circle cx="224" cy="38"  r="28" fill="#3090d4"/>
    <circle cx="366" cy="58"  r="27" fill="#e87c24"/>
    <circle cx="92"  cy="120" r="28" fill="#3090d4"/>
    <circle cx="182" cy="134" r="27" fill="#26bc68"/>
    <circle cx="254" cy="158" r="29" fill="#f2c618"/>
    <circle cx="328" cy="124" r="27" fill="#e87c24"/>
    <circle cx="420" cy="140" r="28" fill="#18a898"/>
    <circle cx="166" cy="254" r="27" fill="#3090d4"/>
