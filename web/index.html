<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="color-scheme" content="light dark">
    <title>Semantic Bible</title>
    <link rel="stylesheet" href="styles.css?v=9.2.1">
    <!-- Load D3.js for high-performance physics and canvas rendering -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="icon" type="image/jpeg" href="favicon.jpg">
</head>
<body>
    <header style="position: relative; z-index: 20000;">
        <div class="header-row">
            <h1><span class="header-title-text" id="header-title-text" role="button" tabindex="0" title="Reset to word landscape">Semantic Bible</span> <span class="header-version">v9.2.1</span></h1>
        </div>
    </header>
    <main>
        <bible-word-map foundation="bsb" src-2d="data/output/wordmap_2d.json?v=9.2.1" src-verses="data/output/verse_index.json?v=9.2.1" src-books="data/output/bookmap_2d.json?v=9.2.1" src-versemap="data/output/versemap_2d.json?v=9.2.1" src-2d-bsb="data/output/wordmap_2d.json?v=9.2.1" src-verses-bsb="data/output/verse_index.json?v=9.2.1" src-books-bsb="data/output/bookmap_2d.json?v=9.2.1" src-versemap-bsb="data/output/versemap_2d.json?v=9.2.1" src-2d-lxx="data/output/wordmap_2d_lxx.json?v=9.2.1" src-verses-lxx="data/output/verse_index_lxx.json?v=9.2.1" src-books-lxx="data/output/bookmap_2d_lxx.json?v=9.2.1" src-versemap-lxx="data/output/versemap_2d_lxx.json?v=9.2.1" src-2d-vul="data/output/wordmap_2d_vul.json?v=9.2.1" src-verses-vul="data/output/verse_index_vul.json?v=9.2.1" src-books-vul="data/output/bookmap_2d_vul.json?v=9.2.1" src-versemap-vul="data/output/versemap_2d_vul.json?v=9.2.1"></bible-word-map>
    </main>
    <footer>
        <a href="https://github.com/rotareti/semantic-bible-word-map" target="_blank">View source on GitHub</a> <span style="margin: 0 10px; color: var(--text-muted); vertical-align: middle;">|</span> <i style="color: var(--text-muted);">"Freely you have received; freely give."</i>
    </footer>
    <script src="bible-word-map.js?v=9.2.1" type="module"></script>
    <script>
        const mapEl = document.querySelector('bible-word-map');

        // Title click: go back to word view with no keywords, holding current canon
        const titleBtn = document.getElementById('header-title-text');
        if (titleBtn) {
            const handleTitleReset = () => {
                if (mapEl && mapEl.hideLegendWindow) {
                    mapEl.hideLegendWindow();
                }
                if (mapEl && mapEl.resetToWordView) {
                    mapEl.resetToWordView();
                } else if (mapEl && mapEl.setViewMode) {
                    mapEl.setViewMode('words', true);
                } else if (mapEl && mapEl.clearAllKeywords) {
                    mapEl.clearAllKeywords();
                }
            };
            titleBtn.addEventListener('click', handleTitleReset);
            titleBtn.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    handleTitleReset();
                }
            });
        }
    </script>
</body>
</html>
